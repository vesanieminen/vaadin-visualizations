name: Publish Flow Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the visualization
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          for file in docs/flow-explorer/*.js docs/flow-explorer/vendor/*.js; do
            node --check "$file"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the standalone explorer
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/flow-explorer
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
